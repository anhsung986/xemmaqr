<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quét & Đọc Mã QR</title>
    <!-- Thư viện quét mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset & Base Style */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #2e1065 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
            color: #f8fafc;
            overflow-y: auto;
        }

        /* Container Card */
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #7c3aed, #d946ef);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.4);
            margin-bottom: 8px;
            color: #ffffff;
        }

        .title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Tabs Switch */
        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Camera Frame */
        .scanner-box {
            position: relative;
            background: #020617;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
            margin-bottom: 16px;
            min-height: 200px;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 12px;
        }

        /* Buttons Grid */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981, #0d9488);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-stop {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        /* File Upload Area */
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: 2px dashed rgba(139, 92, 246, 0.4);
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.4);
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, 0.1);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .upload-text {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            display: block;
        }

        .upload-hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            display: block;
        }

        /* Khung nhúng thông báo (Embed Status Box) */
        .status-embed {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .status-embed.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .status-embed.error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        .status-embed.hidden {
            display: none !important;
        }

        /* Result Section */
        .result-box {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 16px;
        }

        .result-label {
            font-size: 11px;
            font-weight: 800;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-label::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .result-text {
            background: #020617;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #f1f5f9;
            word-break: break-all;
            border: 1px solid #1e293b;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .btn-copy {
            background: #334155;
            color: #fff;
            width: 100%;
        }

        .btn-link {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            text-decoration: none;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="icon-badge"><i class="fa-solid fa-qrcode"></i></div>
            <h1 class="title">QUÉT MÃ QR</h1>
            <p class="subtitle">Đọc thông tin nhanh chóng & tiện lợi</p>
        </div>

        <!-- Switch Tab -->
        <div class="tabs">
            <button id="tab-camera" class="tab-btn active" onclick="switchTab('camera')">Camera</button>
            <button id="tab-file" class="tab-btn" onclick="switchTab('file')">Tải ảnh lên</button>
        </div>

        <!-- Section Camera -->
        <div id="section-camera">
            <div class="scanner-box">
                <div id="reader"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-start" onclick="startScanner()">▶ Bật Camera</button>
                <button class="btn btn-stop" onclick="stopScanner()">⏹ Tắt</button>
            </div>
        </div>

        <!-- Section File Upload -->
        <div id="section-file" class="hidden">
            <label class="upload-area">
                <span class="upload-icon">📂</span>
                <span class="upload-text">Bấm vào đây để chọn ảnh mã QR</span>
                <span class="upload-hint">Hỗ trợ JPG, PNG, WEBP</span>
                <input type="file" id="qr-file-input" accept="image/*" style="display: none;" onchange="scanFromFile(event)">
            </label>
        </div>

        <!-- Khung nhúng thông báo (Embed Status Box) -->
        <div id="status-embed" class="status-embed hidden">
            <i id="status-icon" class="fa-solid fa-circle-check"></i>
            <span id="status-text">Thông báo</span>
        </div>

        <!-- Kết quả -->
        <div id="result-container" class="result-box hidden">
            <div class="result-label">Nội dung giải mã được</div>
            <div id="qr-result-text" class="result-text"></div>
            
            <div class="btn-group">
                <button class="btn btn-copy" onclick="copyResult()">📋 Sao chép</button>
                <div id="action-link-container"></div>
            </div>
        </div>
    </div>

    <!-- Hidden element for file scanning -->
    <div id="hidden-reader" style="display: none;"></div>

    <script>
        let html5QrCode = null;

        function showStatus(message, type = 'success') {
            const statusBox = document.getElementById('status-embed');
            const statusText = document.getElementById('status-text');
            const statusIcon = document.getElementById('status-icon');

            statusText.innerText = message;
            statusBox.className = `status-embed ${type}`;

            if (type === 'success') {
                statusIcon.className = 'fa-solid fa-circle-check';
            } else {
                statusIcon.className = 'fa-solid fa-triangle-exclamation';
            }

            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(() => {
                statusBox.classList.add('hidden');
            }, 4000);
        }

        function switchTab(tab) {
            const btnCam = document.getElementById('tab-camera');
            const btnFile = document.getElementById('tab-file');

            if (tab === 'camera') {
                document.getElementById('section-camera').classList.remove('hidden');
                document.getElementById('section-file').classList.add('hidden');
                btnCam.classList.add('active');
                btnFile.classList.remove('active');
            } else {
                document.getElementById('section-camera').classList.add('hidden');
                document.getElementById('section-file').classList.remove('hidden');
                btnFile.classList.add('active');
                btnCam.classList.remove('active');
                stopScanner();
            }
        }

        function onScanSuccess(decodedText) {
            showResult(decodedText);
            stopScanner();
        }

        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess
            ).catch(err => {
                showStatus("Không thể bật camera. Hãy kiểm tra lại quyền truy cập!", "error");
                console.error(err);
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        async function scanFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const qrScanner = new Html5Qrcode("hidden-reader");
            try {
                const decodedText = await qrScanner.scanFile(file, true);
                showResult(decodedText);
            } catch (err) {
                showStatus("Không tìm thấy mã QR trong hình ảnh này!", "error");
                console.error(err);
            }
        }

        function showResult(text) {
            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('qr-result-text');
            const actionContainer = document.getElementById('action-link-container');

            resultContainer.classList.remove('hidden');
            resultText.innerText = text;
            actionContainer.innerHTML = '';

            if (text.startsWith('http://') || text.startsWith('https://')) {
                actionContainer.innerHTML = `
                    <a href="${text}" target="_blank" class="btn btn-link">🔗 Mở link</a>`;
            }
            showStatus("Đã đọc mã QR thành công!", "success");
        }

        function copyResult() {
            const text = document.getElementById('qr-result-text').innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showStatus("Đã sao chép nội dung!", "success");
            });
        }
    </script>
</body>
  </html>
